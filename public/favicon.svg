<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients for 3D Lotus Petals -->
    <linearGradient id="goldPetalLight" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFF2A3" />
      <stop offset="25%" stopColor="#F5D058" />
      <stop offset="60%" stopColor="#D49E24" />
      <stop offset="85%" stopColor="#A6730F" />
      <stop offset="100%" stopColor="#684504" />
    </linearGradient>

    <radialGradient id="goldRimGrad" cx="256" cy="256" r="230" fx="220" fy="220" gradientUnits="userSpaceOnUse">
      <stop offset="70%" stopColor="#F0C742" />
      <stop offset="88%" stopColor="#D1991D" />
      <stop offset="96%" stopColor="#FFECA8" />
      <stop offset="100%" stopColor="#8C5C0B" />
    </radialGradient>

    <radialGradient id="navyDiscGrad" cx="256" cy="240" r="150" fx="240" fy="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#172774" />
      <stop offset="45%" stopColor="#0F1B58" />
      <stop offset="80%" stopColor="#0A1240" />
      <stop offset="100%" stopColor="#050926" />
    </radialGradient>

    <!-- Crown Gold Gradient -->
    <linearGradient id="crownGold" x1="256" y1="120" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFF9C4" />
      <stop offset="20%" stopColor="#FFD54F" />
      <stop offset="50%" stopColor="#FFA000" />
      <stop offset="80%" stopColor="#FF8F00" />
      <stop offset="100%" stopColor="#FF6F00" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="lotusShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3D2403" flood-opacity="0.5" />
    </filter>
    <filter id="discShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <filter id="deityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFE082" flood-opacity="0.35" />
    </filter>

    <!-- Text Paths -->
    <!-- Top Arc for 'Sri Sridivya Bhudevi Sametha Thirumalavasa' -->
    <path id="topTextArc" d="M 86,256 A 170,170 0 1,1 426,256" fill="none" />
    <!-- Bottom Arc for 'Sevasesvaseva Trust' (clockwise along the bottom) -->
    <path id="bottomTextArc" d="M 102,256 A 154,154 0 0,0 410,256" fill="none" />

    <!-- Reusable Lotus Petal -->
    <g id="petal">
      <!-- Back Layer / Outer Bevel -->
      <path d="M 256,12 C 243,45 220,80 220,110 C 220,128 234,142 256,146 C 278,142 292,128 292,110 C 292,80 269,45 256,12 Z" fill="#8C5C0B" opacity="0.6" />
      <!-- Main Golden Petal Body -->
      <path d="M 256,16 C 245,46 223,78 223,106 C 223,124 236,138 256,142 C 276,138 289,124 289,106 C 289,78 267,46 256,16 Z" fill="url(#goldPetalLight)" />
      <!-- Central Ridge Highlight -->
      <path d="M 256,18 L 253,106 C 253,122 256,138 256,142 C 256,138 259,122 259,106 L 256,18 Z" fill="#FFFCE6" opacity="0.8" />
      <!-- Left Shading -->
      <path d="M 256,18 C 246,47 225,78 225,106 C 225,123 236,136 254,141 L 256,18 Z" fill="#B37D14" opacity="0.28" />
      <!-- Right Golden Highlight -->
      <path d="M 256,18 L 258,141 C 276,136 287,123 287,106 C 287,78 266,47 256,18 Z" fill="#FFF2A3" opacity="0.32" />
    </g>

    <!-- Secondary Layer Small Petal -->
    <g id="secondaryPetal">
      <path d="M 256,38 C 248,60 236,86 236,108 C 236,122 245,132 256,135 C 267,132 276,122 276,108 C 276,86 264,60 256,38 Z" fill="#A87412" />
      <path d="M 256,42 C 249,63 238,87 238,107 C 238,120 246,129 256,132 C 266,129 274,120 274,107 C 274,87 263,63 256,42 Z" fill="#F3CA4C" />
      <path d="M 256,42 L 256,132" stroke="#FFF7B8" stroke-width="1.8" />
    </g>
  </defs>

  <!-- ==================== 1. OUTER 16-PETAL GOLDEN LOTUS CREST ==================== -->
  <g filter="url(#lotusShadow)">
    <!-- Secondary Interstitial Petals (Rotated 11.25 deg) -->
    <g transform="rotate(11.25 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(33.75 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(56.25 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(78.75 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(101.25 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(123.75 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(146.25 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(168.75 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(191.25 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(213.75 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(236.25 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(258.75 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(281.25 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(303.75 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(326.25 256 256)"><use href="#secondaryPetal" /></g>
    <g transform="rotate(348.75 256 256)"><use href="#secondaryPetal" /></g>

    <!-- Primary 16 Sculpted Golden Lotus Petals -->
    <g><use href="#petal" /></g>
    <g transform="rotate(22.5 256 256)"><use href="#petal" /></g>
    <g transform="rotate(45 256 256)"><use href="#petal" /></g>
    <g transform="rotate(67.5 256 256)"><use href="#petal" /></g>
    <g transform="rotate(90 256 256)"><use href="#petal" /></g>
    <g transform="rotate(112.5 256 256)"><use href="#petal" /></g>
    <g transform="rotate(135 256 256)"><use href="#petal" /></g>
    <g transform="rotate(157.5 256 256)"><use href="#petal" /></g>
    <g transform="rotate(180 256 256)"><use href="#petal" /></g>
    <g transform="rotate(202.5 256 256)"><use href="#petal" /></g>
    <g transform="rotate(225 256 256)"><use href="#petal" /></g>
    <g transform="rotate(247.5 256 256)"><use href="#petal" /></g>
    <g transform="rotate(270 256 256)"><use href="#petal" /></g>
    <g transform="rotate(292.5 256 256)"><use href="#petal" /></g>
    <g transform="rotate(315 256 256)"><use href="#petal" /></g>
    <g transform="rotate(337.5 256 256)"><use href="#petal" /></g>
  </g>

  <!-- ==================== 2. GOLDEN CONCENTRIC BORDERS ==================== -->
  <!-- Outer Gold Rim Base -->
  <circle cx="256" cy="256" r="215" fill="url(#goldRimGrad)" stroke="#784C07" stroke-width="3" />
  <!-- Inner Gold Ridge -->
  <circle cx="256" cy="256" r="205" fill="#E8B532" stroke="#FFF7BD" stroke-width="2" />
  <circle cx="256" cy="256" r="201" fill="#9E690B" stroke="#684204" stroke-width="1.5" />

  <!-- ==================== 3. WHITE CIRCULAR TEXT BAND ==================== -->
  <circle cx="256" cy="256" r="198" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2" />

  <!-- Outer Ring Inscription (Top): 'Sri Sridivya Bhudevi Sametha Thirumalavasa' -->
  <text fill="#C2185B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20.5" font-weight="900" letter-spacing="0.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      Sri Sridivya Bhudevi Sametha Thirumalavasa
    </textPath>
  </text>

  <!-- Outer Ring Inscription (Bottom): 'Sevasesvaseva Trust' -->
  <text fill="#C2185B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="0.8">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      Sevasesvaseva Trust
    </textPath>
  </text>

  <!-- Flanking Golden Diamond Florets (Left & Right) -->
  <!-- Left Floret -->
  <g transform="translate(68, 256) scale(1.1)">
    <path d="M 0,-10 L 4,-3 L 11,0 L 4,3 L 0,10 L -4,3 L -11,0 L -4,-3 Z" fill="#D4AF37" stroke="#8C5C0B" stroke-width="0.8" />
    <circle cx="0" cy="0" r="2.2" fill="#E51E2B" />
  </g>
  <!-- Right Floret -->
  <g transform="translate(444, 256) scale(1.1)">
    <path d="M 0,-10 L 4,-3 L 11,0 L 4,3 L 0,10 L -4,3 L -11,0 L -4,-3 Z" fill="#D4AF37" stroke="#8C5C0B" stroke-width="0.8" />
    <circle cx="0" cy="0" r="2.2" fill="#E51E2B" />
  </g>

  <!-- ==================== 4. INNER ROYAL NAVY DISC ==================== -->
  <!-- Inner Border Gold Ring -->
  <circle cx="256" cy="256" r="144" fill="#9C6B0D" stroke="#DDA829" stroke-width="2.5" />
  <!-- Deep Navy Disc -->
  <circle cx="256" cy="256" r="140" fill="url(#navyDiscGrad)" stroke="#1F348C" stroke-width="2" filter="url(#discShadow)" />

  <!-- ==================== 5. SACRED DEITY & AYUDHAS ==================== -->
  <g filter="url(#deityGlow)">
    
    <!-- LEFT: SUDARSHANA CHAKRA (Divine Discus) -->
    <g transform="translate(182, 246) scale(0.65)">
      <!-- Flaming Glow Points -->
      <circle cx="0" cy="0" r="32" fill="#FFE58F" opacity="0.2" />
      <!-- Ornate Outer Prongs -->
      <path d="M 0,-36 L 5,-28 L -5,-28 Z" fill="#FFC107" />
      <path d="M 0,36 L 5,28 L -5,28 Z" fill="#FFC107" />
      <path d="M -36,0 L -28,5 L -28,-5 Z" fill="#FFC107" />
      <path d="M 36,0 L 28,5 L 28,-5 Z" fill="#FFC107" />
      <path d="M -25,-25 L -22,-16 L -16,-22 Z" fill="#FFC107" />
      <path d="M 25,-25 L 22,-16 L 16,-22 Z" fill="#FFC107" />
      <path d="M -25,25 L -22,16 L -16,22 Z" fill="#FFC107" />
      <path d="M 25,25 L 22,16 L 16,22 Z" fill="#FFC107" />
      <!-- Outer Gold Ring -->
      <circle cx="0" cy="0" r="26" fill="url(#crownGold)" stroke="#8A5A00" stroke-width="2" />
      <!-- Inner Ring -->
      <circle cx="0" cy="0" r="18" fill="#F57C00" stroke="#FFF7BD" stroke-width="1.5" />
      <!-- Central Ruby Jewel -->
      <circle cx="0" cy="0" r="10" fill="#D32F2F" stroke="#FFE58F" stroke-width="1.5" />
      <circle cx="-3" cy="-3" r="3" fill="#FFCDD2" opacity="0.8" />
    </g>

    <!-- RIGHT: PANCHAJANYA SHANKU (Divine Conch) -->
    <g transform="translate(330, 246) scale(0.65)">
      <!-- Flaming Glow Points -->
      <circle cx="0" cy="0" r="32" fill="#FFE58F" opacity="0.2" />
      <!-- Ornate Outer Prongs -->
      <path d="M 0,-36 L 5,-28 L -5,-28 Z" fill="#FFC107" />
      <path d="M 0,36 L 5,28 L -5,28 Z" fill="#FFC107" />
      <path d="M -36,0 L -28,5 L -28,-5 Z" fill="#FFC107" />
      <path d="M 36,0 L 28,5 L 28,-5 Z" fill="#FFC107" />
      <path d="M -25,-25 L -22,-16 L -16,-22 Z" fill="#FFC107" />
      <path d="M 25,-25 L 22,-16 L 16,-22 Z" fill="#FFC107" />
      <path d="M -25,25 L -22,16 L -16,22 Z" fill="#FFC107" />
      <path d="M 25,25 L 22,16 L 16,22 Z" fill="#FFC107" />
      <!-- Gold Ornate Conch Body -->
      <circle cx="0" cy="0" r="26" fill="url(#crownGold)" stroke="#8A5A00" stroke-width="2" />
      <!-- Spiral Inner Conch Shape -->
      <path d="M -8,-16 C 6,-18 16,-10 16,2 C 16,12 8,18 -2,16 C -10,14 -14,6 -12,-4 C -10,-12 -2,-14 -8,-16 Z" fill="#FFFCE6" stroke="#C59B27" stroke-width="1.5" />
      <!-- Central Emerald Gem -->
      <circle cx="0" cy="0" r="8" fill="#2E7D32" stroke="#FFF59D" stroke-width="1.5" />
      <circle cx="-2" cy="-2" r="2.5" fill="#A5D6A7" opacity="0.8" />
    </g>

    <!-- CENTER: PRESIDING DEITY - LORD SRI TIRUMALANADHA / VENKATESWARA -->
    <g transform="translate(256, 218)">
      
      <!-- 1. Layered Kireetam (Tall Golden Crown) -->
      <!-- Crown Top Finial (Kalasha) -->
      <path d="M -3,-100 L 0,-108 L 3,-100 Z" fill="#FFE58F" />
      <circle cx="0" cy="-97" r="3.5" fill="#FFD54F" stroke="#8A5A00" stroke-width="0.8" />
      <!-- Crown Tier 1 (Apex Cone) -->
      <path d="M -9,-78 L 9,-78 L 6,-94 L -6,-94 Z" fill="url(#crownGold)" stroke="#996515" stroke-width="1" />
      <circle cx="0" cy="-86" r="2" fill="#E51E2B" />
      
      <!-- Crown Tier 2 -->
      <path d="M -15,-58 L 15,-58 L 11,-78 L -11,-78 Z" fill="url(#crownGold)" stroke="#996515" stroke-width="1" />
      <circle cx="0" cy="-68" r="3" fill="#2E7D32" />
      <circle cx="-7" cy="-68" r="1.5" fill="#FFF" />
      <circle cx="7" cy="-68" r="1.5" fill="#FFF" />

      <!-- Crown Tier 3 (Middle Filigree Band) -->
      <path d="M -22,-36 L 22,-36 L 17,-58 L -17,-58 Z" fill="url(#crownGold)" stroke="#8A5A00" stroke-width="1" />
      <!-- Gemstone Row -->
      <circle cx="-13" cy="-47" r="2.5" fill="#E51E2B" />
      <circle cx="-6" cy="-47" r="2.5" fill="#2E7D32" />
      <circle cx="0" cy="-47" r="3" fill="#E51E2B" stroke="#FFF" stroke-width="0.5" />
      <circle cx="6" cy="-47" r="2.5" fill="#2E7D32" />
      <circle cx="13" cy="-47" r="2.5" fill="#E51E2B" />

      <!-- Crown Tier 4 (Base Ornate Band) -->
      <path d="M -27,-16 L 27,-16 L 24,-36 L -24,-36 Z" fill="url(#crownGold)" stroke="#7A4D00" stroke-width="1.2" />
      <!-- Pearl / Gold bead row -->
      <line x1="-24" y1="-26" x2="24" y2="-26" stroke="#FFE58F" stroke-width="2" stroke-dasharray="2 2" />

      <!-- Crown Arch Lower Rim -->
      <path d="M -28,-16 C -15,-10 15,-10 28,-16 L 29,-10 C 15,-4 -15,-4 -29,-10 Z" fill="#FFE58F" stroke="#7A4D00" stroke-width="1" />

      <!-- 2. Sacred Black Stone Countenance / Divine Face -->
      <path d="M -24,-12 C -25,12 -18,32 0,33 C 18,32 25,12 24,-12 C 12,-7 -12,-7 -24,-12 Z" fill="#1C1E24" stroke="#2D313A" stroke-width="1" />

      <!-- Makara Kundalas (Golden Ear Ornaments) -->
      <!-- Left Earring -->
      <g transform="translate(-27, 8)">
        <circle cx="0" cy="0" r="9" fill="url(#crownGold)" stroke="#784C07" stroke-width="1" />
        <circle cx="0" cy="0" r="4" fill="#D32F2F" />
        <path d="M -2,9 L 0,13 L 2,9 Z" fill="#FFE58F" />
      </g>
      <!-- Right Earring -->
      <g transform="translate(27, 8)">
        <circle cx="0" cy="0" r="9" fill="url(#crownGold)" stroke="#784C07" stroke-width="1" />
        <circle cx="0" cy="0" r="4" fill="#D32F2F" />
        <path d="M -2,9 L 0,13 L 2,9 Z" fill="#FFE58F" />
      </g>

      <!-- 3. SACRED THIRUMAN / NAMAM (Pure White & Bright Red Tilak) -->
      <!-- White U-Shape Namam Prongs -->
      <path d="M -11,-15 L -6,-15 L -2,12 L -6,12 L -9,2 Z" fill="#FFFFFF" />
      <path d="M 11,-15 L 6,-15 L 2,12 L 6,12 L 9,2 Z" fill="#FFFFFF" />
      <path d="M -6,10 C -2,14 2,14 6,10 L 6,13 C 2,17 -2,17 -6,13 Z" fill="#FFFFFF" />
      <!-- Red Center Tilak (Kasturi / Srichurnam) -->
      <path d="M -2.5,-16 L 2.5,-16 L 1.8,17 L -1.8,17 Z" fill="#E51E2B" />
      <polygon points="0,22 -2.5,16 2.5,16" fill="#E51E2B" />

      <!-- Divine Smile & Chin Jewel -->
      <path d="M -5,24 Q 0,27 5,24" stroke="#FFE58F" stroke-width="1" fill="none" stroke-linecap="round" />
      <circle cx="0" cy="29" r="1.5" fill="#FFE58F" />

      <!-- 4. Sacred Floral Garland (Mala) at Base of Deity -->
      <g transform="translate(0, 36)">
        <!-- Green Foliage Layer -->
        <path d="M -34,-2 C -18,10 18,10 34,-2 C 30,12 -30,12 -34,-2 Z" fill="#2E7D32" />
        <!-- Pink & White Floral Petals -->
        <circle cx="-28" cy="2" r="5" fill="#FF80AB" />
        <circle cx="-28" cy="2" r="2.5" fill="#FFF" />
        <circle cx="-19" cy="5" r="5.5" fill="#F06292" />
        <circle cx="-19" cy="5" r="2.8" fill="#FFF" />
        <circle cx="-10" cy="7" r="6" fill="#FF4081" />
        <circle cx="-10" cy="7" r="3" fill="#FFE082" />
        <circle cx="0" cy="8" r="6.5" fill="#E91E63" />
        <circle cx="0" cy="8" r="3" fill="#FFF59D" />
        <circle cx="10" cy="7" r="6" fill="#FF4081" />
        <circle cx="10" cy="7" r="3" fill="#FFE082" />
        <circle cx="19" cy="5" r="5.5" fill="#F06292" />
        <circle cx="19" cy="5" r="2.8" fill="#FFF" />
        <circle cx="28" cy="2" r="5" fill="#FF80AB" />
        <circle cx="28" cy="2" r="2.5" fill="#FFF" />
      </g>

    </g>

    <!-- ==================== 6. SBST BOLD WHITE TYPOGRAPHY ==================== -->
    <g transform="translate(256, 332)">
      <!-- Subtle Back Glow -->
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial Black, sans-serif" font-size="39" font-weight="900" letter-spacing="3" fill="#030822" stroke="#030822" stroke-width="6" stroke-linejoin="round">
        SBST
      </text>
      <!-- Crisp Pure White Foreground -->
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial Black, sans-serif" font-size="39" font-weight="900" letter-spacing="3" fill="#FFFFFF">
        SBST
      </text>
    </g>

  </g>
</svg>
